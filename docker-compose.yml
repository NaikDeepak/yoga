services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: yoga_local
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # Direct connection — migrations only, bypasses the pooler.
      # Mirrors the "session pooler for migrate, transaction pooler for app" split
      # docs/setup.md already uses for real Supabase.
      # Loopback-only: trust auth means anyone who can reach this port has no-password access.
      - '127.0.0.1:5433:5432'
    volumes:
      - yoga_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ''
      DB_NAME: yoga_local
      AUTH_TYPE: trust
      POOL_MODE: transaction
      ADMIN_USERS: postgres
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
    ports:
      # App connects here — transaction-mode pooler, mimics Neon's pooled DATABASE_URL.
      # Loopback-only: trust auth means anyone who can reach this port has no-password access.
      - '127.0.0.1:6432:5432'

volumes:
  yoga_pgdata:
